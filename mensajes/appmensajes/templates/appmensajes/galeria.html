{% load static %}
<html>
    <head>
        <meta charset="UTF-8">
        <title> Galeria de fotos </title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <div class="contenedor-mensaje">
            <h1> Galeria de fotos </h1>
            {% if fotos %}
            <div class="fila">
                {% for foto in fotos %}
                <div class="columna">
                    <div class="contenedor-foto">
                        <img src="{{foto.imagen.url}}" alt="{{foto.descripcion}}" class="foto">
                        {% if foto.descripcion %}
                        <div class="cuerpo_foto">
                            <p class="texto_foto">{{ foto.descripcion }}</p>
                        </div>"

                        {% endif %}
                    </div>

                </div>
                {% endfor %}
            </div>
            {% else %}
                <p>No hay fotos aún</p>
            {% endif %}
        </div>
    </body>
</html>
